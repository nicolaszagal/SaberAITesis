# Uso local de Cloud (worker: consume Redis Streams, corre el LSTM, publica
# veredicto). Cloud "real" se despliega en Render con cloud/Dockerfile
# directo (no con este compose) — ver GUIA_EJECUCION.md sección 6.2.
#
# Build context = backend/ (no cloud/): cloud depende de shared/ y del
# checkpoint en dataset/lstm_4class/checkpoints/, ambos fuera de este
# directorio — ver cloud/Dockerfile.
#
# "cloud" y "redis" quedan bajo el perfil "localdev" (igual que antes en
# el compose raíz): correr Cloud vía este compose es solo para probar el
# pipeline completo 100% local, no el flujo normal (Cloud en Render).

services:
  cloud:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    profiles: ["localdev"]
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    profiles: ["localdev"]
    ports:
      - "6379:6379"
