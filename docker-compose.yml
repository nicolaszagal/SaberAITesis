# Uso local. Cloud "real" se despliega en Render con Dockerfile.cloud
# directo (no con este compose) — ver GUIA_EJECUCION.md sección Docker.
# Acá: Fog corriendo en esta máquina contra Redis remoto (Upstash u otro),
# y opcionalmente Cloud + un Redis local solo para probar el pipeline
# completo sin depender de Render/Upstash mientras desarrollás.

services:
  fog:
    build:
      context: .
      dockerfile: Dockerfile.fog
    # Necesario para que aiortc/WebRTC sea alcanzable (ver el comentario
    # largo en Dockerfile.fog). En Docker Desktop para Mac, requiere
    # habilitar el toggle beta "Enable host networking" antes de levantar
    # este servicio, o el front no va a poder completar la conexión WebRTC.
    network_mode: host
    env_file:
      - .env
    volumes:
      # Sibling de backend/, igual estructura que ya usás en venv (y la que
      # le pedimos a Carlos replicar). Solo lectura: el contenedor no
      # necesita escribir ahí.
      - ../dataset:/app/dataset:ro

  cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    profiles: ["localdev"]
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    profiles: ["localdev"]
    ports:
      - "6379:6379"

  # Captura local (iPhones con Larix -> RTMP -> MediaMTX -> RTSP -> edge/ ->
  # WebSocket al front). Separado de "localdev" porque requiere hardware
  # real (los dos iPhones) en la misma red, no solo el pipeline Fog/Cloud.
  mediamtx:
    image: bluenviron/mediamtx:latest
    profiles: ["local"]
    ports:
      - "1935:1935" # RTMP entrada desde los iPhones (Larix)
      - "8554:8554" # RTSP salida, consumida por edge/
    restart: unless-stopped

  edge:
    build: ./edge
    depends_on:
      - mediamtx
    ports:
      - "8001:8001"
    env_file:
      - ./edge/.env
    profiles: ["local"]
    restart: unless-stopped
    healthcheck:
      # Sin -f: el servidor WebSocket responde 426 Upgrade Required a un
      # GET plano, que curl -f trataría como error. Alcanza con que haya
      # respuesta HTTP (el server está arriba y aceptando conexiones);
      # solo falla si no logra ni conectar.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8001/ || exit 1"]
      interval: 30s
