# Modo piloto (DOCK02): Fog corre nativo en el equipo y el resto sigue en Docker.
# Se combina con docker-compose.yml; no reemplaza el flujo principal.
#
#   docker compose -f docker-compose.yml -f docker-compose.nativo.yml up -d
#   sh scripts/fog_nativo.sh
#
# PostgreSQL y Redis se publican solo en 127.0.0.1 (puertos en .env:
# POSTGRES_HOST_PORT y REDIS_HOST_PORT). Fog queda fuera del arranque: el perfil
# "docker" solo se activa si se pide a propósito. Cloud y frontend no cambian.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5436}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

  fog:
    profiles: ["docker"]
