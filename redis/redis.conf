# Redis SABRE.AI (DEPLOY07). Sin puerto en claro: solo TLS 1.3 con mTLS.
port 0
tls-port 6379
tls-cert-file /dev/shm/redis-tls/server.crt
tls-key-file /dev/shm/redis-tls/server.key
tls-ca-cert-file /dev/shm/redis-tls/ca.crt
tls-auth-clients yes
tls-protocols "TLSv1.3"

# Usuarios: el entrypoint genera este archivo con el hash de REDIS_PASSWORD.
aclfile /dev/shm/redis-tls/users.acl

# Los streams son transitorios: sin persistencia, sin volumen.
save ""
appendonly no
maxmemory 200mb
maxmemory-policy noeviction

# Sin comandos de administración remota.
protected-mode yes
