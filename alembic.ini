# Migraciones de la base `sabre` (PostgreSQL 16). Ejecutar desde backend/:
#     DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
[alembic]
script_location = fog/infrastructure/persistence/migrations
prepend_sys_path = .
path_separator = os
# La URL sale de DATABASE_URL (ver migrations/env.py), no de este archivo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
